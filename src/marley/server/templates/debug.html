<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARley &mdash; Debug</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Decorative bubbles -->
  <div class="bubbles" aria-hidden="true">
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>
    <div class="bubble bubble-4"></div>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <a href="/" class="header-logo" title="Philipps-Universität Marburg">
        <img src="/static/logo-uni-marburg.png" alt="Philipps-Universität Marburg">
      </a>
      <div class="header-divider"></div>
      <span class="header-app-name">MARley</span>
    </div>
    <div class="header-right">
      <nav class="header-nav">
        <a href="/">Chat</a>
        <a href="/debug" class="active">Debug</a>
      </nav>
      <div class="stateless-badge">
        <span class="stateless-dot"></span>
        <span class="stateless-text">Stateless &mdash; No conversation memory</span>
      </div>
    </div>
  </header>

  <!-- Debug layout -->
  <div class="debug-layout">

    <!-- Sidebar: configuration + server status -->
    <aside class="debug-sidebar">

      <div class="sidebar-section">
        <div class="sidebar-title">Pipeline Configuration</div>

        <div class="form-group">
          <label class="form-label" for="retriever-type">Retriever</label>
          <select class="form-control" id="retriever-type">
            <option value="bm25">BM25</option>
            <option value="vector">Vector</option>
            <option value="hybrid" selected>Hybrid</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Knowledge Bases</label>
          <div class="checkbox-group" id="kb-checkboxes">
            <label><input type="checkbox" value="stpo" checked> StPO</label>
            <label><input type="checkbox" value="faq-stpo" checked> FAQ-StPO</label>
            <label><input type="checkbox" value="faq-ao" checked> FAQ-AO</label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="strategy">Strategy</label>
          <select class="form-control" id="strategy">
            <option value="single">Single</option>
            <option value="merged_pool" selected>Merged Pool</option>
            <option value="fusion">Fusion (RRF)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="k-value">Top-k</label>
          <input class="form-control" type="number" id="k-value" value="5" min="1" max="50">
        </div>

        <div class="form-group">
          <label class="form-label" for="threshold">Threshold <span style="font-weight:400;font-size:11px;">(empty = auto)</span></label>
          <input class="form-control" type="number" id="threshold" step="0.01" min="0" max="1" placeholder="auto">
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">Server Status</div>
        <div id="server-status">
          <div class="status-item">
            <span class="status-dot loading" id="ollama-dot"></span>
            <span id="ollama-status">Checking&hellip;</span>
          </div>
          <div class="status-item" id="model-row" style="display:none">
            <span style="font-size:11px;color:var(--c-text-faint);margin-left:14px;" id="model-label"></span>
          </div>
          <div class="status-item" id="cache-row" style="display:none">
            <span style="font-size:11px;color:var(--c-text-faint);margin-left:14px;" id="cache-label"></span>
          </div>
        </div>
      </div>

    </aside><!-- /debug-sidebar -->

    <!-- Main area -->
    <main class="debug-main" id="debug-main">

      <form class="debug-query-form" id="query-form">
        <input type="text" id="query" placeholder="Ask a question &hellip;" autocomplete="off">
        <button type="submit" id="send-btn" class="btn btn-primary">Run</button>
      </form>

      <div id="result"></div>

    </main>

    <!-- PDF slide-in panel -->
    <aside class="pdf-panel" id="pdf-panel" aria-label="StPO PDF viewer">
      <div class="pdf-panel-header">
        <span class="pdf-panel-title" id="pdf-panel-title">M.Sc. CS Study Regulations (StPO)</span>
        <button class="pdf-panel-close" id="pdf-panel-close" title="Close PDF viewer">&times;</button>
      </div>
      <iframe id="pdf-frame" src="" title="StPO PDF"></iframe>
    </aside>

  </div><!-- /debug-layout -->

  <script src="/static/debug.js"></script>
</body>
</html>
