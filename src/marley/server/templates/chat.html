<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARley &mdash; Study Advising Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="header">
        <h1>MARley &mdash; Study Advising Assistant</h1>
        <nav>
            <a href="/" class="active">Chat</a>
            <a href="/debug">Debug</a>
            <a href="/evaluation">Evaluation</a>
        </nav>
    </header>

    <div class="chat-container">
        <div id="chat-log" class="chat-log"></div>

        <div class="chat-input-area">
            <form id="chat-form" class="chat-form">
                <textarea
                    id="query"
                    placeholder="Ask a question about the M.Sc. Computer Science program..."
                    rows="1"
                    autocomplete="off"
                ></textarea>
                <button type="submit" id="send-btn" class="btn btn-primary">Send</button>
            </form>
        </div>
    </div>

    <script src="/static/chat.js"></script>
</body>
</html>
