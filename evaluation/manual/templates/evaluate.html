<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARley Manual Evaluation</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <header>
        <h1>MARley Manual Evaluation</h1>
        <div id="progress-bar">
            <span id="progress-text">Loading...</span>
            <div id="progress-fill"></div>
        </div>
    </header>

    <div id="filter-bar">
        <label>
            Source:
            <select id="filter-source"></select>
        </label>
        <label>
            Distractors:
            <select id="filter-distractors">
                <option value="">All</option>
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </label>
        <label>
            Category:
            <select id="filter-category">
                <option value="">All</option>
                <option value="direct">Direct</option>
                <option value="multi-source">Multi-source</option>
                <option value="unanswerable">Unanswerable</option>
            </select>
        </label>
        <label>
            Status:
            <select id="filter-status">
                <option value="">All</option>
                <option value="pending">Pending</option>
                <option value="judged">Judged</option>
            </select>
        </label>
    </div>

    <main id="evaluation-area">
        <div id="no-items" class="hidden">
            <p>No items match the current filters.</p>
        </div>

        <div id="item-display" class="hidden">
            <div id="item-header">
                <span id="item-index">1 / 825</span>
                <span id="item-id"></span>
                <span id="item-judgement-badge" class="hidden"></span>
            </div>

            <div id="question-box">
                <h3>Question</h3>
                <p id="question-text"></p>
            </div>

            <div id="answers-grid">
                <div class="answer-box">
                    <h3>Generated Answer</h3>
                    <p id="generated-answer"></p>
                </div>
                <div class="answer-box">
                    <h3>Reference Answer</h3>
                    <p id="reference-answer"></p>
                </div>
            </div>

            <div id="metadata-bar">
                <span id="meta-kb"></span>
                <span id="meta-distractors"></span>
                <span id="meta-category"></span>
                <span id="meta-abstention"></span>
            </div>

            <div id="notes-section">
                <label for="notes-input">Notes (optional):</label>
                <textarea id="notes-input" rows="2" placeholder="Any observations or edge case notes..."></textarea>
            </div>

            <div id="judgement-buttons">
                <div id="answer-judgements" class="judgement-row">
                    <button class="btn-judgement btn-correct" data-judgement="correct" title="Key: 1">
                        <span class="key-hint">1</span> Correct
                    </button>
                    <button class="btn-judgement btn-partial" data-judgement="partially_correct" title="Key: 2">
                        <span class="key-hint">2</span> Partially Correct
                    </button>
                    <button class="btn-judgement btn-incorrect" data-judgement="incorrect" title="Key: 3">
                        <span class="key-hint">3</span> Incorrect
                    </button>
                </div>
                <div id="abstention-judgements" class="judgement-row">
                    <button class="btn-judgement btn-correct-abs" data-judgement="correct_abstention" title="Key: 4">
                        <span class="key-hint">4</span> Correct Abstention
                    </button>
                    <button class="btn-judgement btn-incorrect-abs" data-judgement="incorrect_abstention" title="Key: 5">
                        <span class="key-hint">5</span> Incorrect Abstention
                    </button>
                    <button class="btn-judgement btn-missing-abs" data-judgement="missing_abstention" title="Key: 6">
                        <span class="key-hint">6</span> Missing Abstention
                    </button>
                </div>
            </div>

            <div id="navigation">
                <button id="btn-prev" title="Key: ArrowLeft">&larr; Previous</button>
                <button id="btn-next" title="Key: ArrowRight">Next &rarr;</button>
            </div>
        </div>
    </main>

    <footer>
        <p>MARley Manual Evaluation &mdash; Keyboard: 1-6 judge, &larr;&rarr; navigate</p>
    </footer>

    <script src="static/app.js"></script>
</body>
</html>
